name: CI Deep
on:
  push:
    branches: [main]
  schedule:
    - cron: "49 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deep:
    name: deep (${{ matrix.node-version }}, ${{ matrix.package-manager }})
    runs-on: ${{ vars.PM_LOCAL_DEEP != 'off' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
        package-manager: [npm, bun]
    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
    steps:
      - name: Record queue wait separately from execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          created=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/unbraind/pm-swarm/actions/runs/$GITHUB_RUN_ID" | jq -r .created_at)
          start=$(date -u +%s)
          queue_wait=unknown
          if [ -n "$created" ] && [ "$created" != "null" ]; then
            created_epoch=$(date -u -d "$created" +%s)
            [ -n "$created_epoch" ] && queue_wait=$((start - created_epoch))
          fi
          {
            echo "### Deep leg timing record"
            echo "- run created: ${created:-unknown}"
            echo "- queue wait: ${queue_wait} s (run creation until this runner started the job; execution starts now)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "EXECUTION_START_EPOCH=$start" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.environment == 'github-hosted'
      - run: bun --version
      - run: npm ci
      - run: ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      - name: Full npm release gate
        if: matrix.package-manager == 'npm'
        run: env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 npm run release:check
      - name: Full Bun release gate
        if: matrix.package-manager == 'bun'
        run: env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 bun run release:check
      - run: bun install --no-save
      - name: Record execution span, peak memory and the coverage gate receipt
        if: always()
        run: |
          end=$(date -u +%s)
          {
            if [ -n "${EXECUTION_START_EPOCH:-}" ]; then
              echo "- execution: $((end - EXECUTION_START_EPOCH)) s (runner-local, excluding queue wait)"
            else
              echo "- execution: unknown (no runner-local start recorded)"
            fi
            peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null)
            if [ -n "$peak" ]; then
              echo "- container peak memory: $peak bytes (cgroup v2)"
            else
              echo "- container peak memory: unavailable (no readable cgroup v2 memory.peak)"
            fi
            if [ -f coverage/gate-receipt.json ]; then
              echo "- coverage gate receipt (complete run):"
              echo '  ```json'
              sed 's/^/  /' coverage/gate-receipt.json
              echo '  ```'
            else
              echo "- coverage gate receipt: absent; a refused run leaves only the receipt line in the gate step log above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
